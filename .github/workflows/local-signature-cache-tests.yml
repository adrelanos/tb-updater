## End-to-end tests for update-torbrowser, run in a Debian trixie container.
##
## The signature-freshness cache scenarios, the fixture generator, and the new
## '--input gui' end-to-end scenario now live in the dist-ai tb-updater-tests
## suite (github.com/org-ai-assisted/dist-ai), driven here as the unprivileged
## 'tbtest' account against the installed update-torbrowser. The sandbox-resume
## regression stays in-tree because it must run as root and needs the
## 'tb-updater' system account.
##
## genmkfile, helper-scripts, and msgcollector are installed from their upstream
## Kicksecure git repositories using the project's own genmkfile install flow.
## No deb.kicksecure.com apt repo is added.

name: e2e + sandbox-resume

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: debian:trixie
    steps:
      - name: Install apt pre-reqs + genmkfile + helper-scripts
        uses: org-ai-assisted/developer-meta-files/.github/actions/install-deps@master
        with:
          ## dctrl-tools provides grep-dctrl, which genmkfile uses to
          ## compute build dependencies from each package's
          ## debian/control.
          apt-packages: ca-certificates curl git sudo adduser build-essential dctrl-tools

      - name: Install msgcollector
        env:
          GH_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          ## Clone msgcollector from the same org as the workflow.
          ## Resolves to org-ai-assisted/msgcollector on org-ai-assisted runs,
          ## Kicksecure/msgcollector on Kicksecure runs, etc. Hard error if the
          ## org does not have msgcollector - no implicit upstream fallback (an
          ## org choosing to host its own CI must explicitly fork msgcollector;
          ## a silent cross-org clone would be a supply-chain footgun).
          git clone --depth=1 \
              "https://github.com/${GH_REPOSITORY_OWNER}/msgcollector.git" \
              /tmp/msgcollector
          cd /tmp/msgcollector
          sudo genmkfile install

      - name: Install tb-updater runtime + test dependencies from Debian
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          ## faketime is used by make-fixture --signed-at for the
          ## "signature too old" negative scenario (a required check, not
          ## skipped). acl provides setfacl, which sandbox-update-torbrowser
          ## requires at script-load time ('has setfacl').
          apt-get install -y --no-install-recommends \
            sq sqop libarchive-tools safe-rm \
            curl jq psmisc pv iproute2 python3 \
            faketime acl

      - name: Checkout tb-updater
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Checkout dist-ai (test suites)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: ${{ github.repository_owner }}/dist-ai
          path: _dist-ai
          persist-credentials: false

      - name: Install tb-updater from checkout
        run: |
          set -eux
          sudo genmkfile install

      - name: Create an unprivileged test account
        run: |
          set -eux
          adduser --disabled-password --gecos '' tbtest
          ## The e2e gui scenario swaps the root-owned msgcollector dialogs for
          ## auto-confirm stubs, so tbtest needs passwordless sudo (a required
          ## capability; the scenario fails rather than skips without it).
          printf '%s\n' 'tbtest ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/tbtest
          chmod 0440 /etc/sudoers.d/tbtest
          ## tbtest must be able to reach the checkouts through the working tree.
          repo_path="$(pwd)"
          while [ "$repo_path" != "/" ]; do
            chmod o+rx "$repo_path"
            repo_path="$(dirname -- "$repo_path")"
          done
          chmod -R o+rX _dist-ai
          chown -R tbtest:tbtest .github/ci

      - name: Run dist-ai tb-updater e2e suite (all scenarios, no skips)
        run: |
          set -eux
          sudo -u tbtest env \
            GITHUB_ACTIONS=true CI=true \
            PATH=/usr/local/bin:/usr/bin:/bin \
            "${GITHUB_WORKSPACE}/_dist-ai/usr/bin/dist-ai-tests-all" \
            --e2e --component tb-updater --component-root "${GITHUB_WORKSPACE}" \
            --timeout-heavy 900

      - name: Create tb-updater system user (mirrors tb-updater postinst)
        ## genmkfile install copies files but does not execute the
        ## package postinst, so the 'tb-updater' system account and its
        ## /var/lib/tb-updater/work home directory do not exist by
        ## default. sandbox-update-torbrowser hard-requires both. The
        ## adduser command below is taken verbatim from
        ## debian/tb-updater.postinst's create_tb_updater_user_account.
        run: |
          set -eux
          adduser --home /var/lib/tb-updater/work --quiet --system --group tb-updater || true
          id tb-updater
          test -d /var/lib/tb-updater/work

      - name: Run sandbox-resume regression test
        ## sandbox-update-torbrowser is the postinst entry point and
        ## must run as root, so this scenario does not go through the
        ## unprivileged 'tbtest' account that the file://-fixture
        ## tests use. It stays in-tree because dist-ai's checkout-based
        ## runner cannot provide the root + system-account environment.
        run: |
          env CI=true .github/ci/test-sandbox-resume

      - name: Show generated caches on failure
        if: failure()
        run: |
          set +e
          find /tmp/tb-selftest.* 2>/dev/null | head -80 || true
          find /var/lib/tb-updater/work -maxdepth 4 2>/dev/null || true
          find /var/lib/tb-updater/resume-stash -maxdepth 3 2>/dev/null || true
          ls -la /tmp/test-sandbox-resume-result 2>/dev/null || true
